      border-color: #1d4ed8;

      border-left: 6px solid #2563eb;
      padding-left: 12px;
      font-size: 24px;
      line-height: 1.35;

      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      overflow-wrap: anywhere;
    }
    .lead {
      margin: 0;
      font-size: 18px;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

      margin: 0 0 10px;
      color: #1d4ed8;
      line-height: 1.35;

      line-height: 1.75;

      background: #111827;
      color: #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      line-height: 1.65;
      margin: 0;

      color: #1d4ed8;
      padding: 4px 8px;
      margin: 10px 4px 0 0;
      border-radius: 6px;
      font-size: 12px;

      .back-link { text-align: center; }

      .hero h1 { font-size: 30px; }

      .container {

      .branch-link { text-align: center; }
      .section-title { font-size: 20px; }
      .panel, .card { padding: 18px; }

</head>

  const htmlLang = { zh: "zh-CN", ja: "ja", en: "en" };

  function readSavedLanguage() {
    try {
      return localStorage.getItem("studyNavigatorLanguage") || "zh";
    } catch (error) {
      return "zh";
    }
  }

  function saveLanguage(lang) {
    try {
      localStorage.setItem("studyNavigatorLanguage", lang);
    } catch (error) {
      // Local file previews may block storage. The page should still render.
    }
  }

  let currentLang = readSavedLanguage();

  function getBranchId() {
    const id = location.hash.replace("#", "");
    return branches[id] ? id : "binary";
  }

  function render() {
    const branchId = getBranchId();
    const branch = branches[branchId];
    const data = branch[currentLang] || branch.zh;
    const uiText = ui[currentLang] || ui.zh;

    document.documentElement.lang = htmlLang[currentLang] || "zh-CN";
    document.title = `${data.title} - ${uiText.documentTitle}`;
    document.querySelectorAll("[data-ui]").forEach((el) => {
      el.textContent = uiText[el.dataset.ui];
    });

    document.getElementById("branchTitle").textContent = data.title;
    document.getElementById("branchSubtitle").textContent = data.subtitle;
    document.getElementById("goalText").textContent = data.goal;
    document.getElementById("cheatBlock").textContent = data.cheat || branch.zh.cheat || "";
    document.getElementById("exampleBlock").textContent = data.example;
    document.getElementById("memoryText").textContent = data.memory;

    document.getElementById("branchNav").innerHTML = Object.entries(branches).map(([id, value]) => {
      const label = (value.nav[currentLang] || value.nav.zh);
      return `<a class="branch-link ${id === branchId ? "active" : ""}" href="#${id}">${label}</a>`;
    }).join("");

    document.getElementById("pointGrid").innerHTML = data.points.map((item) => {
      return `<article class="card"><h3>${item[0]}</h3><p>${item[1]}</p></article>`;
    }).join("");

    const steps = data.steps || branch.zh.steps || [];
    document.getElementById("stepsGrid").innerHTML = steps.map((item) => {
      return `<article class="card"><h3>${item[0]}</h3><p>${item[1]}</p></article>`;
    }).join("");

    document.getElementById("examGrid").innerHTML = data.exam.map((item) => {
      return `<article class="card"><h3>${item[0]}</h3><p>${item[1]}</p><span class="tag">FE</span></article>`;
    }).join("");

    document.getElementById("quizList").innerHTML = data.quiz.map((item) => `<li>${item}</li>`).join("");

    document.querySelectorAll(".language-button").forEach((button) => {
      button.classList.toggle("active", button.dataset.lang === currentLang);
    });
  }

  document.querySelectorAll(".language-button").forEach((button) => {
    button.addEventListener("click", () => {
      currentLang = button.dataset.lang;
      saveLanguage(currentLang);
      render();
    });
  });

  window.addEventListener("hashchange", render);
  render();
</script>
